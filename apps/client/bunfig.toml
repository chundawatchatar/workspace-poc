[test]
# Registers happy-dom, then Testing Library, then the MSW server. Only this browser app loads them: happy-dom replaces
# `fetch`, `Request`, `Response` and `WebSocket`, and MSW intercepts requests, which the server-side workspaces' tests
# need real.
preload = ["./test/happydom.ts", "./test/testing-library.ts", "./test/network.ts"]
# `bun test --coverage` reports on source files only, not the tests themselves.
coverageSkipTestFiles = true
