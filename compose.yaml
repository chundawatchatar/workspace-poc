# Local dev services for apps/server: Postgres and a Mailpit SMTP sink. Not for production.
# Copy .env.example to .env first, then run `bun run db:up`. Ports listen on 127.0.0.1 only.
name: orch-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-orch}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container, which has the same values in its environment.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

volumes:
  postgres-data:
