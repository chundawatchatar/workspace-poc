[test]
# Registers happy-dom, then Testing Library. Only this browser package loads them: happy-dom replaces `fetch`,
# `Request`, `Response` and `WebSocket`, which the server-side workspaces' tests need real.
preload = ["./test/happydom.ts", "./test/testing-library.ts"]
# `bun test --coverage` reports on source files only, not the tests themselves.
coverageSkipTestFiles = true
# Imported workspace packages have their own suites; report only this package's production code.
coveragePathIgnorePatterns = ["../brand/**", "../shared/**", "../ui/**", "test/**"]
